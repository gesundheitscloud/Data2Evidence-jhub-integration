# [FLOW-3] PG18 auth rules for D2E Logto (issuer http://d2e-caddy:8080/oidc)
# TYPE  DATABASE  USER                  ADDRESS  METHOD
# superuser over the unix socket only: pg18-sync (sync/sync.sh) and docker exec
local   all       postgres                       trust

# a D2E token may log in as role.researcher.<dataset id> only if its `roles` claim lists that role
# (pg_oidc_validator.role_claim=roles, see validator/d2e-roles.patch). The token's `sub` stays the
# authenticated identity: system_user = oauth:<logto user id>.
host    all       /^role\.researcher\.  all      oauth issuer="http://d2e-caddy:8080/oidc" scope="" delegate_ident_mapping=1

host    all       all                   all      reject
local   all       all                            reject
