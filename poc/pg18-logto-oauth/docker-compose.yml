# [RUN] pg18, pg18-sync and the hub as separate containers on D2E's d2e_alp network + an internal notebook network
# Started by run.sh (docker compose --env-file .env.poc up -d --build); D2E must already run (d2e CLI).
# Tokens from D2E Logto carry iss=http://d2e-caddy:8080/oidc, served inside d2e_alp, so no certificates are needed.
name: pg18d2e

services:
  # PostgreSQL 18 that accepts D2E tokens: official image, validator and pg_hba mounted
  pg18:
    image: postgres:18-alpine
    container_name: pg18d2e-pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc-superuser-change-me}  # required by the image; superuser logs in only over the socket
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf                # pg18/pg_hba.conf: the one oauth rule
      - -c
      - oauth_validator_libraries=pg_oidc_validator         # validator/out/pg_oidc_validator.so checks every token
      - -c
      - pg_oidc_validator.role_claim=roles                  # token claim listing the PG roles it may log in as
      - -c
      - pg_oidc_validator.role_prefix=role.researcher.      # only D2E dataset roles can be granted by a token
      - -c
      - pg_oidc_validator.audience=https://alp-default      # token must be for D2E's API resource
      - -c
      - log_connections=on                                  # logs identity="<logto sub>" method=oauth
    volumes:
      - pg18-data:/var/lib/postgresql
      - pg18-socket:/var/run/postgresql                     # shared with pg18-sync (superuser via socket)
      - ./validator/out/pg_oidc_validator.so:/usr/local/lib/postgresql/pg_oidc_validator.so:ro
      - ./pg18/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      alp:         # d2e-caddy:8080 (Logto discovery + JWKS) and the dataset source DBs (FDW)
      notebooks:   # notebooks connect here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 30

  # [FLOW-5] keeps PG18 in line with the D2E datasets (sync/sync.sh): mirror schema + role per dataset
  pg18-sync:
    image: postgres:18-alpine
    container_name: pg18d2e-sync
    depends_on:
      pg18:
        condition: service_healthy
    entrypoint: ["sh", "/sync/sync.sh"]
    environment:
      MINERVA_URL: ${POC_MINERVA_URL:-}                     # D2E metadata DB: portal.dataset, trex.db
      SOURCE_DEMO_DATABASE: ${POC_SOURCE_DEMO_DATABASE:-}   # admin URL of trex.db code demo_database; creates the read-only reader
      JUPYTER_READER_PASSWORD: ${POC_JUPYTER_READER_PASSWORD:-}  # password of d2e_jupyter_reader, used by PG18's FDW
      CATALOG_HOST: pg18d2e-pg18                            # PG18 host written into the catalog for notebooks
      CATALOG_PORT: "5432"
    volumes:
      - pg18-socket:/var/run/postgresql
      - catalog:/catalog                                    # writes datasets.json for the hub
      - ./sync/sync.sh:/sync/sync.sh:ro
    networks:
      alp:         # D2E metadata DB and dataset source DBs

  # [FLOW-1] the hub (hub/), pointed at D2E Logto and this PostgreSQL
  jupyterhub:
    build: ./hub
    container_name: pg18d2e-jupyterhub
    depends_on:
      pg18:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock                      # DockerSpawner starts notebooks on the host's docker
      LOGTO_JUPYTERHUB_CLIENT_ID: ${POC_HUB_CLIENT_ID:-}            # Logto app jupyterhub-pg18-poc (logto_setup.py)
      LOGTO_JUPYTERHUB_CLIENT_SECRET: ${POC_HUB_CLIENT_SECRET:-}
      JUPYTERHUB_CRYPT_KEY: ${POC_HUB_CRYPT_KEY:-}                  # encrypts the stored tokens (auth_state)
      JUPYTERHUB_OAUTH_CALLBACK_URL: http://localhost:8000/hub/oauth_callback  # registered on the Logto app
      LOGTO_AUTHORIZE_URL: https://localhost/oidc/auth              # browser-facing, through D2E's Caddy
      LOGTO_TOKEN_URL: http://d2e-caddy:8080/oidc/token             # server to server, same host as the token's iss
      LOGTO_RESOURCE: https://alp-default                           # token audience; PG18 requires it
      LOGTO_ALLOWED_ROLE: role.jupyteruser                          # D2E portal: Users > Edit roles > "JupyterHub User"
      JUPYTERHUB_HUB_CONNECT_URL: http://pg18d2e-jupyterhub:8081    # how notebooks reach the hub API
      DOCKER_NETWORK_NAME: pg18d2e-notebooks                        # notebooks live only on this internal network
      JUPYTERHUB_NOTEBOOK_IMAGE: pgoauth-notebook:local             # built from notebook/ by run.sh
      D2E_DATASET_CATALOG: /catalog/datasets.json                   # written by pg18-sync, filtered per user
      NOTEBOOK_PG_OAUTH_ISSUER: http://d2e-caddy:8080/oidc          # -> notebook PG_OAUTH_ISSUER, must match pg_hba
      NOTEBOOK_PG_OAUTH_CLIENT_ID: ${POC_HUB_CLIENT_ID:-}           # -> notebook PG_OAUTH_CLIENT_ID
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jupyterhub-data:/srv/jupyterhub/data                        # hub sqlite db + cookie secret
      - catalog:/catalog:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      alp:         # token exchange with d2e-caddy:8080
      notebooks:   # notebooks reach the hub here

volumes:
  pg18-data:
  pg18-socket:
  catalog:
  jupyterhub-data:

networks:
  alp:
    external: true
    name: d2e_alp
  notebooks:
    name: pg18d2e-notebooks
    internal: true
